services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: blac
      POSTGRES_PASSWORD: blac
      POSTGRES_DB: blac
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blac -d blac"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local dev. MinIO no longer publishes
  # public images, so RustFS (S3 API on :9000, console on :9001) is used.
  # Any S3-compatible service works: the API only speaks the S3 protocol.
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: blacminio
      RUSTFS_SECRET_KEY: blacminio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["storagedata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., target: api }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://blac:blac@postgres:5432/blac?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: storage:9000
      S3_PUBLIC_ENDPOINT: localhost:9000   # host clients use in presigned URLs
      S3_ACCESS_KEY: blacminio
      S3_SECRET_KEY: blacminio-secret
      S3_BUCKET: blac-media
    ports: ["8080:8080"]

  # Turns uploaded originals into the low / medium / high AAC renditions.
  worker:
    build: { context: ., target: worker }
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://blac:blac@postgres:5432/blac?sslmode=disable
      S3_ENDPOINT: storage:9000
      S3_ACCESS_KEY: blacminio
      S3_SECRET_KEY: blacminio-secret
      S3_BUCKET: blac-media
      WORKER_CONCURRENCY: "2"

volumes:
  pgdata:
  storagedata:
