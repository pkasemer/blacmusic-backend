# nginx for Blac Music: the API (blacmusic.pkasemer.com) and the object store used
# for presigned uploads/downloads (blacmedia.pkasemer.com).
# Installed as /etc/nginx/sites-available/blacmusic.conf. The certificate lines
# point at a placeholder until certbot has issued the real one (see deploy/README.md).
#
# Both names sit behind Cloudflare. The real visitor address comes from the
# CF-Connecting-IP header, trusted ONLY when the connection really is from a
# Cloudflare address (/etc/nginx/blacmusic/cloudflare-realip.conf, generated).

server {
    listen 80;
    listen [::]:80;
    server_name blacmusic.pkasemer.com blacmedia.pkasemer.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blacmusic.pkasemer.com;

    ssl_certificate     /etc/nginx/blacmusic/fullchain.pem;
    ssl_certificate_key /etc/nginx/blacmusic/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/blacmusic/cloudflare-realip.conf;

    client_max_body_size 2m;            # API requests are small JSON; audio never goes through here
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: clients must not choose their address
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header True-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

# Object storage: presigned URLs are signed for this exact host name, so Host is
# passed through untouched. Uploads arrive in 8 MiB parts (or a single PUT up to
# 16 MiB); downloads are audio files streamed with range requests.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blacmedia.pkasemer.com;

    ssl_certificate     /etc/nginx/blacmusic/fullchain.pem;
    ssl_certificate_key /etc/nginx/blacmusic/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/blacmusic/cloudflare-realip.conf;

    client_max_body_size 64m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;     # stream uploads to storage instead of spooling them to disk first
        proxy_buffering off;             # stream downloads, range requests work as-is
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
