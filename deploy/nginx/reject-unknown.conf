# Requests that name no site served here (the server's bare IP address, unknown host names) are dropped without an
# answer, so the server does not give away which domains live on it.
#
# Install as /etc/nginx/sites-available/00-reject-unknown.conf and link it into sites-enabled. nginx before 1.19.4
# has no ssl_reject_handshake, so it needs a placeholder certificate that names nothing:
#   mkdir -p /etc/nginx/reject-unknown
#   openssl req -x509 -nodes -newkey rsa:2048 -days 3650 -subj "/CN=invalid" \
#       -keyout /etc/nginx/reject-unknown/placeholder.key -out /etc/nginx/reject-unknown/placeholder.crt
#   chmod 600 /etc/nginx/reject-unknown/placeholder.key
# Undo: remove the link from sites-enabled, then "nginx -t && systemctl reload nginx".
#
# This hides which names the address serves. It does not stop someone who already knows both from connecting
# directly; only limiting ports 80 and 443 to the proxy's addresses would.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/reject-unknown/placeholder.crt;
    ssl_certificate_key /etc/nginx/reject-unknown/placeholder.key;
    # Keep this: the default server's settings decide the TLS versions offered during the handshake, and the
    # top-level nginx.conf still allows TLS 1.0 and 1.1.
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 444; # close the connection without sending anything
}
