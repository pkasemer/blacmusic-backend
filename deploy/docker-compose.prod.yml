# Production stack for a small single-server deployment (1-2 GB RAM).
# Nothing is published to the internet directly: only the API (8080) and the
# object store (9000) listen, on 127.0.0.1, and nginx fronts both.
# Secrets live in .env on the server (see deploy/env.example), never in git.
name: blacmusic

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: blac
    # Small-server tuning: a few connections, modest caches.
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "effective_cache_size=256MB",
              "-c", "max_connections=40", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blac -d blac"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Only used for rate limiting: no persistence, small and bounded.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # S3-compatible object storage (RustFS), pinned to the version this was tested with.
  storage:
    image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
    ports: ["127.0.0.1:9000:9000"]   # nginx (media.blacmusic...) fronts this; the console (9001) is not published
    volumes: ["storagedata:/data"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    image: blacmusic-api:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://blac:${POSTGRES_PASSWORD}@postgres:5432/blac?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      S3_ENDPOINT: storage:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT in .env}
      S3_PUBLIC_USE_SSL: ${S3_PUBLIC_USE_SSL:-true}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET: blac-media
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in .env}
      TRUST_PROXY: "true"            # the port below is reachable only by nginx on this machine
      FREE_STORAGE_GB: ${FREE_STORAGE_GB:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Blac Music <no-reply@blacmusic.pkasemer.com>}
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 192m
    logging: *logging

  # Transcoding (ffmpeg) is CPU heavy: it is kept to half a core and one job at
  # a time so it cannot starve the other sites sharing this machine.
  worker:
    image: blacmusic-worker:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://blac:${POSTGRES_PASSWORD}@postgres:5432/blac?sslmode=disable
      S3_ENDPOINT: storage:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET: blac-media
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      WORKER_CONCURRENCY: "1"
    cpus: "0.5"
    mem_limit: 512m
    logging: *logging

volumes:
  pgdata:
  storagedata:
